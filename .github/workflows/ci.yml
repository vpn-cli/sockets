name: Sportz CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        
    - name: Verify Backend (Node.js/Express)
      working-directory: ./sportz-websockets-main
      run: |
        npm install
        
    - name: Verify Frontend (React/Vite)
      working-directory: ./sportz-frontend-main
      run: |
        npm install
        npm run build
