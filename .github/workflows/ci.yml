name: Sportz CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    name: Build & Verify
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        
    - name: Verify Backend (Node.js/Express)
      working-directory: ./sportz-websockets-main
      env:
        REDIS_URL: redis://127.0.0.1:6379
      run: |
        npm install
        npm test
        
    - name: Verify Frontend (React/Vite)
      working-directory: ./sportz-frontend-main
      run: |
        npm install
        npm test
        npm run build
