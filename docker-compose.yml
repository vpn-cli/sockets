services:
  redis:
    image: redis:7-alpine
    container_name: sportz-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend-1:
    build:
      context: ./sportz-websockets-main
      dockerfile: Dockerfile
    container_name: sportz-backend-1
    restart: unless-stopped
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - TRUST_PROXY=true
      - DATABASE_URL=${DATABASE_URL}
      - ARCJET_KEY=${ARCJET_KEY}
      - ARCJET_ENV=${ARCJET_ENV:-development}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend-2:
    build:
      context: ./sportz-websockets-main
      dockerfile: Dockerfile
    container_name: sportz-backend-2
    restart: unless-stopped
    environment:
      - PORT=8001
      - HOST=0.0.0.0
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - TRUST_PROXY=true
      - DATABASE_URL=${DATABASE_URL}
      - ARCJET_KEY=${ARCJET_KEY}
      - ARCJET_ENV=${ARCJET_ENV:-development}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  loadbalancer:
    image: nginx:alpine
    container_name: sportz-loadbalancer
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy

  frontend:
    build:
      context: ./sportz-frontend-main
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000
        - VITE_WS_BASE_URL=ws://localhost:8000/ws
    container_name: sportz-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - loadbalancer

  seeder:
    build:
      context: ./sportz-websockets-main
      dockerfile: Dockerfile
    container_name: sportz-seeder
    restart: unless-stopped
    command: ["npm", "run", "seed"]
    environment:
      - API_URL=http://loadbalancer:80
      - DATABASE_URL=${DATABASE_URL}
      - DELAY_MS=${DELAY_MS:-500}
    depends_on:
      - loadbalancer

  ingestor:
    build:
      context: ./sportz-websockets-main
      dockerfile: Dockerfile
    container_name: sportz-ingestor
    restart: unless-stopped
    command: ["npm", "run", "ingest"]
    environment:
      - API_URL=http://loadbalancer:80
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - DATA_SOURCE=${DATA_SOURCE:-simulated}
      - FOOTBALL_DATA_API_KEY=${FOOTBALL_DATA_API_KEY:-}
      - REPLAY_SPEED=${REPLAY_SPEED:-1x}
      - POLL_INTERVAL_SECONDS=60
    depends_on:
      - loadbalancer
