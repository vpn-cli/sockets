services:
  backend:
    build:
      context: ./sportz-websockets-main
      dockerfile: Dockerfile
    container_name: sportz-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://neondb_owner:npg_aRFK2A1QjrIy@ep-blue-meadow-b4adhcjq-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require}
      - ARCJET_KEY=${ARCJET_KEY:-ajkey_01m0qt0qpde9rbr4e4gtp45yks}
      - ARCJET_ENV=${ARCJET_ENV:-development}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./sportz-frontend-main
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000
        - VITE_WS_BASE_URL=ws://localhost:8000/ws
    container_name: sportz-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
